name: Prüfen und Image bauen

# Bei jedem Push auf main: Typprüfung, dann Docker-Image bauen und nach
# GitHub Container Registry (ghcr.io) schieben. Portainer holt es von dort
# (siehe portainer-stack.yml).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pruefen:
    name: Typprüfung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  image:
    name: Image bauen
    needs: pruefen
    # Bei Pull Requests nur prüfen, nicht veröffentlichen
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # GHCR verlangt Kleinbuchstaben im Image-Namen
      - name: Image-Name bestimmen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 zusätzlich, damit das Image auch auf ARM-Servern und Raspberry Pi läuft
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ergebnis
        run: echo "Image -> ${{ env.IMAGE }}:latest" >> "$GITHUB_STEP_SUMMARY"
